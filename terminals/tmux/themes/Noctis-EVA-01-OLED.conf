# Noctis (EVA-01 OLED)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-01-OLED.conf

set -g status-style "bg=#000000,fg=#e4dcf5"
set -g window-status-style "bg=#000000,fg=#614ca0"
set -g window-status-current-style "bg=#39ff14,fg=#000000,bold"
set -g window-status-activity-style "fg=#ff6a00"
set -g window-status-bell-style "fg=#ff2d55,bold"
set -g pane-border-style "fg=#614ca0"
set -g pane-active-border-style "fg=#39ff14"
set -g message-style "bg=#39ff14,fg=#000000"
set -g message-command-style "bg=#000000,fg=#e4dcf5"
set -g mode-style "bg=#391577,fg=#e4dcf5"
set -g display-panes-colour "#614ca0"
set -g display-panes-active-colour "#39ff14"
set -g clock-mode-colour "#39ff14"
