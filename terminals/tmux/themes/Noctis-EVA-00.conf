# Noctis (EVA-00)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-00.conf

set -g status-style "bg=#d8ecfb,fg=#0d2a4a"
set -g window-status-style "bg=#d8ecfb,fg=#6b7f96"
set -g window-status-current-style "bg=#0a84e6,fg=#000000,bold"
set -g window-status-activity-style "fg=#e85a00"
set -g window-status-bell-style "fg=#d42a1f,bold"
set -g pane-border-style "fg=#6b7f96"
set -g pane-active-border-style "fg=#0a84e6"
set -g message-style "bg=#0a84e6,fg=#000000"
set -g message-command-style "bg=#d8ecfb,fg=#0d2a4a"
set -g mode-style "bg=#94ceff,fg=#0d2a4a"
set -g display-panes-colour "#6b7f96"
set -g display-panes-active-colour "#0a84e6"
set -g clock-mode-colour "#0a84e6"
