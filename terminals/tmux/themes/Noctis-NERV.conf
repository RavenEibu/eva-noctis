# Noctis (NERV)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-NERV.conf

set -g status-style "bg=#060608,fg=#f0f0f0"
set -g window-status-style "bg=#060608,fg=#5d5d6b"
set -g window-status-current-style "bg=#e60012,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#ffa726"
set -g window-status-bell-style "fg=#e60012,bold"
set -g pane-border-style "fg=#5d5d6b"
set -g pane-active-border-style "fg=#e60012"
set -g message-style "bg=#e60012,fg=#ffffff"
set -g message-command-style "bg=#060608,fg=#f0f0f0"
set -g mode-style "bg=#680a14,fg=#f0f0f0"
set -g display-panes-colour "#5d5d6b"
set -g display-panes-active-colour "#e60012"
set -g clock-mode-colour "#e60012"
