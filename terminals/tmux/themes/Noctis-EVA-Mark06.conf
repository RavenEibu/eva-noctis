# Noctis (EVA Mark.06)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-Mark06.conf

set -g status-style "bg=#e6e8f0,fg=#1a1d2e"
set -g window-status-style "bg=#e6e8f0,fg=#6b7090"
set -g window-status-current-style "bg=#6a3df0,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#eb6200"
set -g window-status-bell-style "fg=#d4143a,bold"
set -g pane-border-style "fg=#6b7090"
set -g pane-active-border-style "fg=#6a3df0"
set -g message-style "bg=#6a3df0,fg=#ffffff"
set -g message-command-style "bg=#e6e8f0,fg=#1a1d2e"
set -g mode-style "bg=#c7c2fa,fg=#1a1d2e"
set -g display-panes-colour "#6b7090"
set -g display-panes-active-colour "#6a3df0"
set -g clock-mode-colour "#6a3df0"
