# Noctis (Instrumentality)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Instrumentality.conf

set -g status-style "bg=#f7dfe4,fg=#3a0f1d"
set -g window-status-style "bg=#f7dfe4,fg=#7a5060"
set -g window-status-current-style "bg=#d4142a,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#b86a00"
set -g window-status-bell-style "fg=#d4142a,bold"
set -g pane-border-style "fg=#7a5060"
set -g pane-active-border-style "fg=#d4142a"
set -g message-style "bg=#d4142a,fg=#ffffff"
set -g message-command-style "bg=#f7dfe4,fg=#3a0f1d"
set -g mode-style "bg=#f6b8c4,fg=#3a0f1d"
set -g display-panes-colour "#7a5060"
set -g display-panes-active-colour "#d4142a"
set -g clock-mode-colour "#d4142a"
