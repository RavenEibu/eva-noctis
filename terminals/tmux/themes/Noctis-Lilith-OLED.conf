# Noctis (Lilith OLED)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Lilith-OLED.conf

set -g status-style "bg=#000000,fg=#eae4dc"
set -g window-status-style "bg=#000000,fg=#675750"
set -g window-status-current-style "bg=#d4142a,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#e0a25a"
set -g window-status-bell-style "fg=#ff2d3f,bold"
set -g pane-border-style "fg=#675750"
set -g pane-active-border-style "fg=#d4142a"
set -g message-style "bg=#d4142a,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#eae4dc"
set -g mode-style "bg=#5e0913,fg=#eae4dc"
set -g display-panes-colour "#675750"
set -g display-panes-active-colour "#d4142a"
set -g clock-mode-colour "#d4142a"
