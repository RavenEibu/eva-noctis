# EVA Noctis palettes. scripts/build.py turns each one into the VS Code theme and scripts/terminals.py into every terminal theme.
# A palette with `extends` copies its parent and overrides only the keys written here (tokens are merged one by one).
#
# text colors are adjusted automatically to the contrast targets, so these are the intended colors, not the final ones.

