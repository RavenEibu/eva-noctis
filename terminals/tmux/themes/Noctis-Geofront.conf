# Noctis (Geofront)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Geofront.conf

set -g status-style "bg=#dff3e6,fg=#123326"
set -g window-status-style "bg=#dff3e6,fg=#5a7a6a"
set -g window-status-current-style "bg=#1f9d6a,fg=#000000,bold"
set -g window-status-activity-style "fg=#b25e10"
set -g window-status-bell-style "fg=#c81e3a,bold"
set -g pane-border-style "fg=#5a7a6a"
set -g pane-active-border-style "fg=#1f9d6a"
set -g message-style "bg=#1f9d6a,fg=#000000"
set -g message-command-style "bg=#dff3e6,fg=#123326"
set -g mode-style "bg=#8fdcb0,fg=#123326"
set -g display-panes-colour "#5a7a6a"
set -g display-panes-active-colour "#1f9d6a"
set -g clock-mode-colour "#1f9d6a"
