# Noctis (EVA-08 Light)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-08-Light.conf

set -g status-style "bg=#fbdcee,fg=#3a0a2a"
set -g window-status-style "bg=#fbdcee,fg=#7a4a68"
set -g window-status-current-style "bg=#d4157f,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#b86a00"
set -g window-status-bell-style "fg=#d4142a,bold"
set -g pane-border-style "fg=#7a4a68"
set -g pane-active-border-style "fg=#d4157f"
set -g message-style "bg=#d4157f,fg=#ffffff"
set -g message-command-style "bg=#fbdcee,fg=#3a0a2a"
set -g mode-style "bg=#ffb1db,fg=#3a0a2a"
set -g display-panes-colour "#7a4a68"
set -g display-panes-active-colour "#d4157f"
set -g clock-mode-colour "#d4157f"
