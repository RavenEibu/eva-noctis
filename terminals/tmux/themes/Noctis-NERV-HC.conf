# Noctis (NERV High Contrast)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-NERV-HC.conf

set -g status-style "bg=#000000,fg=#ffffff"
set -g window-status-style "bg=#000000,fg=#9595a3"
set -g window-status-current-style "bg=#e60012,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#ffa726"
set -g window-status-bell-style "fg=#ff616e,bold"
set -g pane-border-style "fg=#9595a3"
set -g pane-active-border-style "fg=#e60012"
set -g message-style "bg=#e60012,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#ffffff"
set -g mode-style "bg=#8a000b,fg=#ffffff"
set -g display-panes-colour "#9595a3"
set -g display-panes-active-colour "#e60012"
set -g clock-mode-colour "#e60012"
