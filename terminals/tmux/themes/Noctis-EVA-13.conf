# Noctis (EVA-13)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-13.conf

set -g status-style "bg=#030108,fg=#ddd3f0"
set -g window-status-style "bg=#030108,fg=#6549aa"
set -g window-status-current-style "bg=#7a3cff,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#ff5a1f"
set -g window-status-bell-style "fg=#e0143a,bold"
set -g pane-border-style "fg=#6549aa"
set -g pane-active-border-style "fg=#7a3cff"
set -g message-style "bg=#7a3cff,fg=#ffffff"
set -g message-command-style "bg=#030108,fg=#ddd3f0"
set -g mode-style "bg=#371874,fg=#ddd3f0"
set -g display-panes-colour "#6549aa"
set -g display-panes-active-colour "#7a3cff"
set -g clock-mode-colour "#7a3cff"
