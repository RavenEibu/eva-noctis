# Noctis (Tabris)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Tabris.conf

set -g status-style "bg=#e6e4f0,fg=#26243a"
set -g window-status-style "bg=#e6e4f0,fg=#6a6888"
set -g window-status-current-style "bg=#6a5fb0,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#a0742a"
set -g window-status-bell-style "fg=#b8323a,bold"
set -g pane-border-style "fg=#6a6888"
set -g pane-active-border-style "fg=#6a5fb0"
set -g message-style "bg=#6a5fb0,fg=#ffffff"
set -g message-command-style "bg=#e6e4f0,fg=#26243a"
set -g mode-style "bg=#c9c2ed,fg=#26243a"
set -g display-panes-colour "#6a6888"
set -g display-panes-active-colour "#6a5fb0"
set -g clock-mode-colour "#6a5fb0"
