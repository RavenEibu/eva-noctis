# Noctis (EVA-03)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-03.conf

set -g status-style "bg=#030406,fg=#e6eefc"
set -g window-status-style "bg=#030406,fg=#4f5c7c"
set -g window-status-current-style "bg=#ff2a2a,fg=#000000,bold"
set -g window-status-activity-style "fg=#ffa000"
set -g window-status-bell-style "fg=#ff2a2a,bold"
set -g pane-border-style "fg=#4f5c7c"
set -g pane-active-border-style "fg=#ff2a2a"
set -g message-style "bg=#ff2a2a,fg=#000000"
set -g message-command-style "bg=#030406,fg=#e6eefc"
set -g mode-style "bg=#103e4c,fg=#e6eefc"
set -g display-panes-colour "#4f5c7c"
set -g display-panes-active-colour "#ff2a2a"
set -g clock-mode-colour "#ff2a2a"
