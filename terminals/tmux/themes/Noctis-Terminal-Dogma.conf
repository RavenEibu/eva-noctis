# Noctis (Terminal Dogma)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Terminal-Dogma.conf

set -g status-style "bg=#020808,fg=#cfe3da"
set -g window-status-style "bg=#020808,fg=#456660"
set -g window-status-current-style "bg=#1fb5a0,fg=#000000,bold"
set -g window-status-activity-style "fg=#e0a030"
set -g window-status-bell-style "fg=#e04545,bold"
set -g pane-border-style "fg=#456660"
set -g pane-active-border-style "fg=#1fb5a0"
set -g message-style "bg=#1fb5a0,fg=#000000"
set -g message-command-style "bg=#020808,fg=#cfe3da"
set -g mode-style "bg=#0b3c36,fg=#cfe3da"
set -g display-panes-colour "#456660"
set -g display-panes-active-colour "#1fb5a0"
set -g clock-mode-colour "#1fb5a0"
