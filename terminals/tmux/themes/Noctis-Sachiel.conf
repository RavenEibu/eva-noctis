# Noctis (Sachiel)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Sachiel.conf

set -g status-style "bg=#080b10,fg=#e6dcc8"
set -g window-status-style "bg=#080b10,fg=#556177"
set -g window-status-current-style "bg=#5b7fa8,fg=#000000,bold"
set -g window-status-activity-style "fg=#f0a050"
set -g window-status-bell-style "fg=#ff3030,bold"
set -g pane-border-style "fg=#556177"
set -g pane-active-border-style "fg=#5b7fa8"
set -g message-style "bg=#5b7fa8,fg=#000000"
set -g message-command-style "bg=#080b10,fg=#e6dcc8"
set -g mode-style "bg=#283648,fg=#e6dcc8"
set -g display-panes-colour "#556177"
set -g display-panes-active-colour "#5b7fa8"
set -g clock-mode-colour "#5b7fa8"
