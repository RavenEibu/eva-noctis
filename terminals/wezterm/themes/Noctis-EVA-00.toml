# Noctis (EVA-00)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)

[colors]
foreground = "#0d2a4a"
background = "#eaf6ff"
cursor_bg = "#eb6200"
cursor_fg = "#eaf6ff"
cursor_border = "#eb6200"
selection_fg = "#0d2a4a"
selection_bg = "#94ceff"
ansi = ["#33445c", "#d42a1f", "#0f9d58", "#e85a00", "#0a84e6", "#7a4fe0", "#0998b6", "#718191"]
