# Noctis (EVA-01 Berserk)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)

[colors]
foreground = "#eee4f7"
background = "#07030a"
cursor_bg = "#e6ff00"
cursor_fg = "#07030a"
cursor_border = "#e6ff00"
selection_fg = "#eee4f7"
selection_bg = "#343508"
ansi = ["#170c24", "#ff2a3a", "#9cff2e", "#ffb020", "#7035d8", "#ff3d8a", "#40d8c0", "#d5c6e8"]
