# Noctis (EVA-01 Light)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-01-Light.conf

set -g status-style "bg=#e8e0fb,fg=#1e1238"
set -g window-status-style "bg=#e8e0fb,fg=#6a5a90"
set -g window-status-current-style "bg=#6a2cd6,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#d15000"
set -g window-status-bell-style "fg=#d4144a,bold"
set -g pane-border-style "fg=#6a5a90"
set -g pane-active-border-style "fg=#6a2cd6"
set -g message-style "bg=#6a2cd6,fg=#ffffff"
set -g message-command-style "bg=#e8e0fb,fg=#1e1238"
set -g mode-style "bg=#cdbaff,fg=#1e1238"
set -g display-panes-colour "#6a5a90"
set -g display-panes-active-colour "#6a2cd6"
set -g clock-mode-colour "#6a2cd6"
