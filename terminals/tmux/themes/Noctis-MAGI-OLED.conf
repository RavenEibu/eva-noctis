# Noctis (MAGI OLED)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-MAGI-OLED.conf

set -g status-style "bg=#000000,fg=#ffc27a"
set -g window-status-style "bg=#000000,fg=#785434"
set -g window-status-current-style "bg=#ff6a00,fg=#000000,bold"
set -g window-status-activity-style "fg=#ff9f1a"
set -g window-status-bell-style "fg=#ff2a2a,bold"
set -g pane-border-style "fg=#785434"
set -g pane-active-border-style "fg=#ff6a00"
set -g message-style "bg=#ff6a00,fg=#000000"
set -g message-command-style "bg=#000000,fg=#ffc27a"
set -g mode-style "bg=#662a00,fg=#ffc27a"
set -g display-panes-colour "#785434"
set -g display-panes-active-colour "#ff6a00"
set -g clock-mode-colour "#ff6a00"
