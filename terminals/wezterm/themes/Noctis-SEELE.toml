# Noctis (SEELE)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)

[colors]
foreground = "#d5dcf5"
background = "#05060d"
cursor_bg = "#ff3b30"
cursor_fg = "#05060d"
cursor_border = "#ff3b30"
selection_fg = "#d5dcf5"
selection_bg = "#232a62"
ansi = ["#12142a", "#ff3b30", "#4be0c6", "#ffb454", "#6c8cff", "#b48cff", "#7ad7ff", "#d5dcf5"]
brights = ["#52598f", "#ff6a60", "#86f0dc", "#ffcf85", "#9fb4ff", "#cdb0ff", "#a6e6ff", "#ffffff"]

[colors.tab_bar]
background = "#020308"

[colors.tab_bar.active_tab]
bg_color = "#5b6cff"
fg_color = "#000000"

[colors.tab_bar.inactive_tab]
bg_color = "#05060d"
fg_color = "#6c8cff"

[metadata]
name = "Noctis-SEELE"
author = "RavenEibu"
origin_url = "https://github.com/RavenEibu/eva-noctis"
