# Noctis (Lilith OLED)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)

[colors]
foreground = "#eae4dc"
background = "#000000"
cursor_bg = "#f2ead8"
cursor_fg = "#000000"
cursor_border = "#f2ead8"
selection_fg = "#eae4dc"
selection_bg = "#5e0913"
ansi = ["#412727", "#ff2d3f", "#a8d8a0", "#e0a25a", "#6fa0e8", "#d89ad8", "#7fd8e0", "#e0d8cc"]
brights = ["#675750", "#ff6470", "#c8f0c0", "#f5c688", "#9cc0ff", "#ecbcec", "#a8eef5", "#ffffff"]

[colors.tab_bar]
background = "#000000"

[colors.tab_bar.active_tab]
bg_color = "#d4142a"
fg_color = "#ffffff"

[colors.tab_bar.inactive_tab]
bg_color = "#000000"
fg_color = "#8fc0ff"

[metadata]
name = "Noctis-Lilith-OLED"
author = "RavenEibu"
origin_url = "https://github.com/RavenEibu/eva-noctis"
