# Noctis (EVA-00 OLED)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-00-OLED.conf

set -g status-style "bg=#000000,fg=#d8ecfb"
set -g window-status-style "bg=#000000,fg=#415d7b"
set -g window-status-current-style "bg=#1fb6ff,fg=#000000,bold"
set -g window-status-activity-style "fg=#ffb02e"
set -g window-status-bell-style "fg=#ff4d5e,bold"
set -g pane-border-style "fg=#415d7b"
set -g pane-active-border-style "fg=#1fb6ff"
set -g message-style "bg=#1fb6ff,fg=#000000"
set -g message-command-style "bg=#000000,fg=#d8ecfb"
set -g mode-style "bg=#0a3d55,fg=#d8ecfb"
set -g display-panes-colour "#415d7b"
set -g display-panes-active-colour "#1fb6ff"
set -g clock-mode-colour "#1fb6ff"
