# Noctis (EVA-01 Berserk)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-01-Berserk.conf

set -g status-style "bg=#040107,fg=#eee4f7"
set -g window-status-style "bg=#040107,fg=#6c4c98"
set -g window-status-current-style "bg=#7a2cff,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#ffb020"
set -g window-status-bell-style "fg=#ff2a3a,bold"
set -g pane-border-style "fg=#6c4c98"
set -g pane-active-border-style "fg=#7a2cff"
set -g message-style "bg=#7a2cff,fg=#ffffff"
set -g message-command-style "bg=#040107,fg=#eee4f7"
set -g mode-style "bg=#343508,fg=#eee4f7"
set -g display-panes-colour "#6c4c98"
set -g display-panes-active-colour "#7a2cff"
set -g clock-mode-colour "#7a2cff"
