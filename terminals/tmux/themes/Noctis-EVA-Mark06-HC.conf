# Noctis (EVA Mark.06 High Contrast)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-Mark06-HC.conf

set -g status-style "bg=#ffffff,fg=#000000"
set -g window-status-style "bg=#ffffff,fg=#535770"
set -g window-status-current-style "bg=#6a3df0,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#943d00"
set -g window-status-bell-style "fg=#af1030,bold"
set -g pane-border-style "fg=#535770"
set -g pane-active-border-style "fg=#6a3df0"
set -g message-style "bg=#6a3df0,fg=#ffffff"
set -g message-command-style "bg=#ffffff,fg=#000000"
set -g mode-style "bg=#b098f7,fg=#000000"
set -g display-panes-colour "#535770"
set -g display-panes-active-colour "#6a3df0"
set -g clock-mode-colour "#6a3df0"
