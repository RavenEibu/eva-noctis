# Noctis (EVA-02)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-02.conf

set -g status-style "bg=#0e0206,fg=#ffe9e4"
set -g window-status-style "bg=#0e0206,fg=#8b4c57"
set -g window-status-current-style "bg=#ff1f3d,fg=#000000,bold"
set -g window-status-activity-style "fg=#ffb020"
set -g window-status-bell-style "fg=#ff1f3d,bold"
set -g pane-border-style "fg=#8b4c57"
set -g pane-active-border-style "fg=#ff1f3d"
set -g message-style "bg=#ff1f3d,fg=#000000"
set -g message-command-style "bg=#0e0206,fg=#ffe9e4"
set -g mode-style "bg=#630d1a,fg=#ffe9e4"
set -g display-panes-colour "#8b4c57"
set -g display-panes-active-colour "#ff1f3d"
set -g clock-mode-colour "#ff1f3d"
