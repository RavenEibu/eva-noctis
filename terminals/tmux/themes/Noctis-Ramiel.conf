# Noctis (Ramiel)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-Ramiel.conf

set -g status-style "bg=#01040c,fg=#cfe0ff"
set -g window-status-style "bg=#01040c,fg=#445c95"
set -g window-status-current-style "bg=#1e6bff,fg=#000000,bold"
set -g window-status-activity-style "fg=#ffc04d"
set -g window-status-bell-style "fg=#ff3b5c,bold"
set -g pane-border-style "fg=#445c95"
set -g pane-active-border-style "fg=#1e6bff"
set -g message-style "bg=#1e6bff,fg=#000000"
set -g message-command-style "bg=#01040c,fg=#cfe0ff"
set -g mode-style "bg=#0b2c6f,fg=#cfe0ff"
set -g display-panes-colour "#445c95"
set -g display-panes-active-colour "#1e6bff"
set -g clock-mode-colour "#1e6bff"
