# Noctis (SEELE)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-SEELE.conf

set -g status-style "bg=#020308,fg=#d5dcf5"
set -g window-status-style "bg=#020308,fg=#52598f"
set -g window-status-current-style "bg=#5b6cff,fg=#000000,bold"
set -g window-status-activity-style "fg=#ffb454"
set -g window-status-bell-style "fg=#ff3b30,bold"
set -g pane-border-style "fg=#52598f"
set -g pane-active-border-style "fg=#5b6cff"
set -g message-style "bg=#5b6cff,fg=#000000"
set -g message-command-style "bg=#020308,fg=#d5dcf5"
set -g mode-style "bg=#232a62,fg=#d5dcf5"
set -g display-panes-colour "#52598f"
set -g display-panes-active-colour "#5b6cff"
set -g clock-mode-colour "#5b6cff"
