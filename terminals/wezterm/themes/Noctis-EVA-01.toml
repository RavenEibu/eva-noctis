# Noctis (EVA-01)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)

[colors]
foreground = "#ece4ff"
background = "#0d0620"
cursor_bg = "#39ff14"
cursor_fg = "#0d0620"
cursor_border = "#39ff14"
selection_fg = "#ece4ff"
selection_bg = "#3b167d"
ansi = ["#1a0f33", "#ff2d55", "#39ff14", "#ff6a00", "#7b2cff", "#ff4fd8", "#2ff0d0", "#d8ccf5"]
brights = ["#654fa7", "#ff6b86", "#7dff5c", "#ff9440", "#a880ff", "#ff85e6", "#7bf7e2", "#ffffff"]

[colors.tab_bar]
background = "#080315"

[colors.tab_bar.active_tab]
bg_color = "#39ff14"
fg_color = "#000000"

[colors.tab_bar.inactive_tab]
bg_color = "#0d0620"
fg_color = "#b48cff"

[metadata]
name = "Noctis-EVA-01"
author = "RavenEibu"
origin_url = "https://github.com/RavenEibu/eva-noctis"
