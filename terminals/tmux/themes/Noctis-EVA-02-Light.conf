# Noctis (EVA-02 Light)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-02-Light.conf

set -g status-style "bg=#ffe4de,fg=#3a0d10"
set -g window-status-style "bg=#ffe4de,fg=#7a5050"
set -g window-status-current-style "bg=#d4142a,fg=#ffffff,bold"
set -g window-status-activity-style "fg=#c25a00"
set -g window-status-bell-style "fg=#d4142a,bold"
set -g pane-border-style "fg=#7a5050"
set -g pane-active-border-style "fg=#d4142a"
set -g message-style "bg=#d4142a,fg=#ffffff"
set -g message-command-style "bg=#ffe4de,fg=#3a0d10"
set -g mode-style "bg=#ffb9b0,fg=#3a0d10"
set -g display-panes-colour "#7a5050"
set -g display-panes-active-colour "#d4142a"
set -g clock-mode-colour "#d4142a"
