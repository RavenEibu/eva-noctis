# Noctis (EVA-08)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-EVA-08.conf

set -g status-style "bg=#0f0312,fg=#ffe6f8"
set -g window-status-style "bg=#0f0312,fg=#834b83"
set -g window-status-current-style "bg=#ff2fa0,fg=#000000,bold"
set -g window-status-activity-style "fg=#ffb400"
set -g window-status-bell-style "fg=#ff3d6e,bold"
set -g pane-border-style "fg=#834b83"
set -g pane-active-border-style "fg=#ff2fa0"
set -g message-style "bg=#ff2fa0,fg=#000000"
set -g message-command-style "bg=#0f0312,fg=#ffe6f8"
set -g mode-style "bg=#641347,fg=#ffe6f8"
set -g display-panes-colour "#834b83"
set -g display-panes-active-colour "#ff2fa0"
set -g clock-mode-colour "#ff2fa0"
