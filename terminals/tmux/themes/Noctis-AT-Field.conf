# Noctis (A.T. Field)
# EVA Noctis (MIT, RavenEibu), based on the Noctis theme family (MIT, Liviu Schera)
# Usage: source-file ~/.config/tmux/themes/Noctis-AT-Field.conf

set -g status-style "bg=#ffe9d1,fg=#3a1e0c"
set -g window-status-style "bg=#ffe9d1,fg=#7a6252"
set -g window-status-current-style "bg=#ff6a00,fg=#000000,bold"
set -g window-status-activity-style "fg=#c86a00"
set -g window-status-bell-style "fg=#c81e1e,bold"
set -g pane-border-style "fg=#7a6252"
set -g pane-active-border-style "fg=#ff6a00"
set -g message-style "bg=#ff6a00,fg=#000000"
set -g message-command-style "bg=#ffe9d1,fg=#3a1e0c"
set -g mode-style "bg=#ffbe79,fg=#3a1e0c"
set -g display-panes-colour "#7a6252"
set -g display-panes-active-colour "#ff6a00"
set -g clock-mode-colour "#ff6a00"
