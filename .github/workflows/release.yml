name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match package.json
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json version ${version}" >&2; exit 1; }
      - name: Build, test and check generated files
        run: bash scripts/build_all.sh --check
      - name: Release assets (VSIX, terminals zip, SHA256SUMS)
        run: python3 scripts/release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
